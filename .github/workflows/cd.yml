name: Release

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v1.2.3)"
        required: false
        type: string

permissions:
  contents: write

env:
  APP_NAME: plexos2duckdb
  # Prefer the dispatch input; otherwise use the tag that triggered the workflow
  TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
  # Fully-qualified ref for actions that need it
  REF: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Checkout test data
        uses: actions/checkout@v7
        with:
          repository: kdheepak/plexos-solution-files
          path: tests/data/plexos-solution-files
          fetch-depth: 1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check package versions
        run: mise run plexos2duckdb:check-versions

      - name: Run test suite
        run: mise run plexos2duckdb:test

  create-release:
    name: Create Release
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      # Creates the GitHub Release for the tag if it doesn't exist yet
      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.REF }}

  publish-python:
    name: Publish Python package
    needs: [upload-python-distributions, upload-binaries]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/plexos2duckdb
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v7
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  upload-python-distributions:
    name: Build & Upload Python distributions (${{ matrix.name }})
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-manylinux_2_28
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
            manylinux: "2_28"
            sdist: true

          - name: linux-aarch64-manylinux_2_28
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python-architecture: arm64
            manylinux: "2_28"
            sdist: false

          # - name: macos-x86_64
          #   os: macos-15-intel
          #   target: x86_64-apple-darwin
          #   python-architecture: x64
          #   manylinux: "off"
          #   sdist: false

          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            python-architecture: arm64
            manylinux: "off"
            sdist: false

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64
            manylinux: "off"
            sdist: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Install Rust (stable)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-architecture }}

      - name: Cache Rust build
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Stage README metadata for source distribution
        if: matrix.sdist
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib

          pyproject_path = pathlib.Path("python/pyproject.toml")
          pyproject = pyproject_path.read_text(encoding="utf-8")
          readme = json.dumps(pathlib.Path("README.md").read_text(encoding="utf-8"))
          source = 'readme = "../README.md"'
          replacement = (
              'readme = { text = '
              f'{readme}, content-type = "text/markdown" }}'
          )
          if pyproject.count(source) != 1:
              raise SystemExit(f"expected one {source!r} entry")
          pyproject_path.write_text(
              pyproject.replace(source, replacement),
              encoding="utf-8",
          )
          PY

      - name: Build Python distributions
        uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-l Rstrtmgr"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CFLAGS_aarch64_unknown_linux_gnu: "-g0"
          CFLAGS_x86_64_unknown_linux_gnu: "-g0"
          CXXFLAGS_aarch64_unknown_linux_gnu: "-g0"
          CXXFLAGS_x86_64_unknown_linux_gnu: "-g0"
        with:
          command: build
          maturin-version: v1.11.5
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          sccache: ${{ runner.os == 'Linux' }}
          before-script-linux: |
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args: >-
            --release --locked --compatibility pypi --out dist ${{ runner.os == 'Linux' && '--jobs
            2' || '' }} ${{ matrix.sdist && '--sdist' || '' }}

      - name: Verify manylinux wheel tag
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wheel="$(find python/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          case "$(basename "$wheel")" in
            *manylinux_2_28*) ;;
            *) echo "Expected a manylinux_2_28 wheel, got $wheel" >&2; exit 1 ;;
          esac

      - name: Upload Python distributions to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            python/dist/*

      - name: Upload Python distributions as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ matrix.name }}
          path: python/dist/*
          if-no-files-found: error

  upload-binaries:
    name: Build & Upload ${{ matrix.name }}
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64

          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive_suffix: macos-aarch64

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Upload rust binary to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v1
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-l Rstrtmgr"
        with:
          bin: ${{ env.APP_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ matrix.target }}
          archive: $bin-$tag-${{ matrix.archive_suffix }}
          checksum: sha256
          locked: true
          ref: ${{ env.REF }}
          include: LICENSE,README.md
          leading-dir: true
